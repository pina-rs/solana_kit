[package]
name = "solana_kit_codegen"
version = "0.1.0"
autobins = false
default-run = "solana_kit_codegen"
edition = "2024"
license = "Unlicense"
publish = false

[features]
default = []
verification = []

[workspace]

[dependencies]
prettyplease = "=0.3.0"
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
solana_kit_core = { path = "../../crates/solana_kit_core", default-features = false }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit"] }

[dev-dependencies]
bincode = "=1.3.3"
solana-address = { version = "=2.7.0", features = ["serde"] }
solana-compute-budget-interface = "=3.0.0"
solana-instruction = "=3.5.1"
solana-nonce = { version = "=3.2.1", features = ["serde"] }
solana-system-interface = { version = "=3.3.0", features = ["alloc", "serde", "bincode"] }
solana_kit_compute_budget = { path = "../../crates/solana_kit_compute_budget" }
solana_kit_system = { path = "../../crates/solana_kit_system" }

[[bin]]
name = "solana_kit_codegen"
path = "src/main.rs"
required-features = ["verification"]

[[bin]]
name = "solana_kit_codegen_wasi"
path = "src/bin/solana_kit_codegen_wasi.rs"

[[bin]]
name = "token_2022_audit"
path = "src/bin/token_2022_audit.rs"
required-features = ["verification"]

[[bin]]
name = "token_2022_client"
path = "src/bin/token_2022_client.rs"
required-features = ["verification"]

[[bin]]
name = "token_2022_dispositions"
path = "src/bin/token_2022_dispositions.rs"
required-features = ["verification"]

[[bin]]
name = "token_2022_fixtures"
path = "src/bin/token_2022_fixtures.rs"
required-features = ["verification"]

[[bin]]
name = "token_fixtures"
path = "src/bin/token_fixtures.rs"
required-features = ["verification"]

[[bin]]
name = "program_clients_gate"
path = "src/bin/program_clients_gate.rs"
required-features = ["verification"]

[[bin]]
name = "program_clients_audit"
path = "src/bin/program_clients_audit.rs"
required-features = ["verification"]
