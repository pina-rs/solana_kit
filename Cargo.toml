[workspace]
members = [
  "crates/solana_kit",
  "crates/solana_kit_account_compression",
  "crates/solana_kit_address_lookup_table",
  "crates/solana_kit_anchor",
  "crates/solana_kit_associated_token_account",
  "crates/solana_kit_attestation_service",
  "crates/solana_kit_browser",
  "crates/solana_kit_client",
  "crates/solana_kit_compute_budget",
  "crates/solana_kit_config",
  "crates/solana_kit_core",
  "crates/solana_kit_helius",
  "crates/solana_kit_leptoskit",
  "crates/solana_kit_loader",
  "crates/solana_kit_memo",
  "crates/solana_kit_mpl_bubblegum",
  "crates/solana_kit_mpl_core",
  "crates/solana_kit_mpl_token_metadata",
  "crates/solana_kit_native",
  "crates/solana_kit_signers",
  "crates/solana_kit_squads",
  "crates/solana_kit_stake",
  "crates/solana_kit_subscriptions",
  "crates/solana_kit_system",
  "crates/solana_kit_token",
  "crates/solana_kit_token_2022",
  "crates/solana_kit_wallet",
  "crates/solana_kit_wasi",
  "verification/browser",
  "verification/browser-http",
  "verification/browser-websocket",
  "verification/conformance",
  "verification/guest",
  "verification/token-2022-contracts",
  "xtask",
]
exclude = [
  "verification/confirmation-factories",
  "verification/core-contracts-portable",
  "verification/durable-nonce",
  "verification/leptoskit",
  "verification/leptoskit-app-journey/runtime",
  "verification/wallet-consumer",
  "verification/wallet-runtime",
  "verification/signer-capabilities",
  "verification/stake-loader-portable",
  "verification/wasi-text-sockets",
]
resolver = "3"

[workspace.package]
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
license = "Unlicense"
rust-version = "1.89"

[workspace.dependencies]
solana_kit_account_compression = { version = "0.1.0", path = "crates/solana_kit_account_compression" }
solana_kit_browser = { version = "0.1.0", path = "crates/solana_kit_browser" }
solana_kit_client = { version = "0.1.0", path = "crates/solana_kit_client" }
solana_kit_core = { version = "0.1.0", path = "crates/solana_kit_core", default-features = false }
solana_kit_native = { version = "0.1.0", path = "crates/solana_kit_native" }
solana_kit_system = { version = "0.1.0", path = "crates/solana_kit_system" }
solana_kit_stake = { version = "0.1.0", path = "crates/solana_kit_stake" }
solana_kit_wallet = { version = "0.1.0", path = "crates/solana_kit_wallet" }
