# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
package_type = "cargo"
changelog = { path = "{{ path }}/CHANGELOG.md", format = "keep_a_changelog" }

[source]
provider = "github"
owner = "pina-rs"
repo = "solana_kit"

[source.releases]
enabled = true
source = "monochange"
branches = ["main"]
enforce_for_tags = true
enforce_for_publish = true
enforce_for_commit = false
changeset_context_timeout_seconds = 120

[source.pull_requests]
enabled = true
branch_prefix = "monochange/release"
base = "main"
title = "chore(release): prepare release"
labels = ["release", "automated"]
auto_merge = false

[cli.release]
help_text = "Prepare, format, commit, and open the release pull request."
inputs = [
  { name = "commit", help_text = "Create the release commit after preparing files", type = "boolean", default = true },
  { name = "create_pr", help_text = "Push the release commit and open or update the release pull request", type = "boolean", default = true },
]
steps = [
  { name = "prepare release", type = "PrepareRelease", allow_empty_changesets = true, inputs = { format = "json" } },
  { name = "refresh standalone lockfiles", type = "Command", shell = "bash", command = "bash tools/update-release-lockfiles.sh", when = "{{ number_of_changesets > 0 }}" },
  { name = "commit release", type = "CommitRelease", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 && inputs.commit }}" },
  { name = "open release request", type = "OpenReleaseRequest", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 && inputs.commit && inputs.create_pr }}" },
]

[cli.publish-check]
help_text = "Validate the release and preview package publishing in dry-run mode."
steps = [
  { name = "publish packages dry run", type = "PublishPackages" },
]

[ecosystems.cargo]
enabled = true
lockfile_commands = [{ command = "cargo update --workspace", cwd = ".", shell = "bash" }]

[ecosystems.cargo.publish]
enabled = true
mode = "builtin"
registry = "crates_io"
trusted_publishing = { enabled = true, mode = "preferred", repository = "pina-rs/solana_kit", workflow = "publish.yml" }

[ecosystems.cargo.auto_discover]
enabled = false

[changesets.affected]
enabled = true
required = true

[package.solana_kit]
path = "crates/solana_kit"
type = "cargo"
changelog = false

[package.solana_kit.publish]
enabled = false
mode = "builtin"
trusted_publishing = false

[package.solana_kit.publish.placeholder]
readme_file = "crates/solana_kit/README.md"

[group.sdk]
packages = [
  "solana_kit_core",
  "solana_kit_client",
  "solana_kit_native",
  "solana_kit_signers",
  "solana_kit_browser",
  "solana_kit_leptoskit",
  "solana_kit_wasi",
]
changelog = { path = "crates/solana_kit_core/CHANGELOG.md", format = "keep_a_changelog" }
release = true
tag = true
version_format = "primary"

[package.solana_kit_core]
path = "crates/solana_kit_core"
type = "cargo"
changelog = false
publish = { enabled = true }
versioned_files = [
  { path = "Cargo.toml", type = "cargo", fields = ["workspace.dependencies.solana_kit_core"] },
]

