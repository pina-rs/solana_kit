# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
package_type = "cargo"
changelog = { path = "{{ path }}/CHANGELOG.md", format = "keep_a_changelog" }

[package.solana_kit]
path = "crates/solana_kit"
type = "cargo"

[package.solana_kit.publish]
enabled = true
mode = "builtin"
trusted_publishing = false

[package.solana_kit.publish.placeholder]
readme_file = "crates/solana_kit/README.md"

[ecosystems.cargo]
enabled = true
lockfile_commands = [{ command = "cargo update --workspace", cwd = ".", shell = "bash" }]

[ecosystems.cargo.auto_discover]
enabled = false

[source]
provider = "github"
owner = "pina-rs"
repo = "solana_kit"

[changesets.affected]
enabled = true
required = true
