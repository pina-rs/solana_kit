# :schema https://monochange.github.io/monochange/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
package_type = "cargo"
changelog = { path = "{{ path }}/CHANGELOG.md", format = "keep_a_changelog" }

[package.solana_kit]
path = "crates/solana_kit"
type = "cargo"

[package.solana_kit.publish]
enabled = false
mode = "builtin"
trusted_publishing = false

[package.solana_kit.publish.placeholder]
readme_file = "crates/solana_kit/README.md"

[package.solana_kit_core]
path = "crates/solana_kit_core"
type = "cargo"
changelog = false
publish = { enabled = false }

[package.solana_kit_client]
path = "crates/solana_kit_client"
type = "cargo"
changelog = false
publish = { enabled = false }

# Add implemented client/adapter packages here when their versions converge.
[package.solana_kit_native]
path = "crates/solana_kit_native"
type = "cargo"
changelog = false
publish = { enabled = false }

# The dependency-free umbrella reservation remains independently at 0.0.0.
[group.sdk]
packages = ["solana_kit_core", "solana_kit_client", "solana_kit_native", "solana_kit_browser", "solana_kit_leptoskit"]
changelog = { path = "crates/solana_kit_core/CHANGELOG.md", format = "keep_a_changelog" }

[ecosystems.cargo]
enabled = true
lockfile_commands = [{ command = "cargo update --workspace", cwd = ".", shell = "bash" }]

[ecosystems.cargo.publish]
enabled = false

[ecosystems.cargo.auto_discover]
enabled = false

[source]
provider = "github"
owner = "pina-rs"
repo = "solana_kit"

[changesets.affected]
enabled = true
required = true

[package.solana_kit_system]
path = "crates/solana_kit_system"
type = "cargo"
publish = { enabled = false }

[package.solana_kit_browser]
path = "crates/solana_kit_browser"
type = "cargo"
changelog = false
publish = { enabled = false }

[package.solana_kit_leptoskit]
path = "crates/solana_kit_leptoskit"
type = "cargo"
changelog = false
publish = { enabled = false }

[package.solana_kit_compute_budget]
path = "crates/solana_kit_compute_budget"
type = "cargo"
publish = { enabled = false }
