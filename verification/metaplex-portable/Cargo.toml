[package]
name = "solana_kit_metaplex_portable"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["guest", "host"]

[dependencies]
serde_json = "1.0.154"
sha3 = { version = "0.10.9", default-features = false }
solana_kit_account_compression = { path = "../../crates/solana_kit_account_compression" }
solana_kit_client = { path = "../../crates/solana_kit_client" }
solana_kit_core = { path = "../../crates/solana_kit_core" }
solana_kit_mpl_bubblegum = { path = "../../crates/solana_kit_mpl_bubblegum", features = ["pda", "hashing", "tree", "das"] }
solana_kit_mpl_core = { path = "../../crates/solana_kit_mpl_core", features = ["pda"] }
solana_kit_mpl_token_metadata = { path = "../../crates/solana_kit_mpl_token_metadata", features = ["pda"] }

[features]
default = ["pda", "hashing", "tree", "das"]
pda = []
hashing = []
tree = []
das = []
corrupt = []

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-test = "=0.3.78"

[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
