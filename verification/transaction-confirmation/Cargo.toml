[package]
name = "solana_kit_confirmation_verification"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.89"

[workspace]

[dependencies]
solana_kit_client = { path = "../../crates/solana_kit_client" }
solana_kit_core = { path = "../../crates/solana_kit_core", default-features = false }

[dev-dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
futures = "=0.3.31"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
solana_kit_system = { path = "../../crates/solana_kit_system" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
