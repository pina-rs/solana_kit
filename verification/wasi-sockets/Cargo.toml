[workspace]

[package]
name = "solana_kit_wasi_sockets_proof"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
wasip2 = "=1.0.4"

[[bin]]
name = "guest"
path = "src/guest.rs"

[[bin]]
name = "runner"
path = "src/runner.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmparser = "=0.240.0"
