[package]
name = "solana_kit_confirmation_factory_verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["confirmation-factories"]
confirmation-factories = []
leptoskit-guest = []
browser-network = []

[[bin]]
name = "browser_network"
path = "src/bin/browser_network.rs"
required-features = ["browser-network"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
futures = "=0.3.31"
serde_json = "=1.0.154"
solana_kit_client = { path = "../../crates/solana_kit_client", features = ["confirmation-factories"] }
solana_kit_core = { path = "../../crates/solana_kit_core" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
solana_kit_browser = { path = "../../crates/solana_kit_browser" }
web-sys = { version = "=0.3.105", features = ["Window", "Performance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
solana_kit_wasi = { path = "../../crates/solana_kit_wasi" }
