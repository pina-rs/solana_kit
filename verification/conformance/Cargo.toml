[package]
name = "solana_kit_conformance"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Host-neutral fixed-vector conformance for the real Solana Kit core"

[features]
default = ["text-codecs"]
text-codecs = ["solana_kit_core/text-codecs"]

[dependencies]
hex-literal = "1.0.0"
solana_kit_client = { path = "../../crates/solana_kit_client" }
solana_kit_core = { path = "../../crates/solana_kit_core", features = ["crypto", "fixed-points", "text-codecs"] }
solana_kit_system = { path = "../../crates/solana_kit_system" }
