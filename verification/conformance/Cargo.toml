[package]
name = "solana_kit_conformance"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Host-neutral fixed-vector conformance for the real Solana Kit core"

[features]
default = ["text-codecs"]
text-codecs = ["solana_kit_core/text-codecs"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
solana_kit_anchor = { path = "../../crates/solana_kit_anchor" }

serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }

hex-literal = "1.0.0"
signer_capability_consumer = { path = "../signer-capabilities" }
solana_kit_associated_token_account = { path = "../../crates/solana_kit_associated_token_account", features = ["crypto"] }
solana_kit_client = { path = "../../crates/solana_kit_client" }
solana_kit_compute_budget = { path = "../../crates/solana_kit_compute_budget" }
solana_kit_core = { path = "../../crates/solana_kit_core", features = ["crypto", "fixed-points", "text-codecs", "bigint-codecs", "keccak"] }
solana_kit_core_contracts_verification = { path = "../core-contracts-portable" }
solana_kit_durable_nonce_verification = { path = "../durable-nonce" }
solana_kit_jupiter = { path = "../../crates/solana_kit_jupiter" }
solana_kit_memo = { path = "../../crates/solana_kit_memo" }
solana_kit_pyth = { path = "../../crates/solana_kit_pyth", features = ["hermes", "crypto"] }
solana_kit_signers = { path = "../../crates/solana_kit_signers", features = ["crypto"] }
solana_kit_system = { path = "../../crates/solana_kit_system" }
solana_kit_token = { path = "../../crates/solana_kit_token" }
solana_kit_wallet = { path = "../../crates/solana_kit_wallet", features = ["mwa"] }
solana_kit_wallet_verification = { path = "../wallet-runtime" }
