[package]
name = "solana_kit_app_journey_runtime"
version = "0.0.0"
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.89"
description = "Private generated application verification runtime"

[workspace]

[features]
generated-wallet-tests = []

[[test]]
name = "generated_wallet"
required-features = ["generated-wallet-tests"]

[dependencies]
leptoskit_bridge = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "71eabc78daac558b1381bdbacfff182f69fc7846" }
leptoskit_bridge_ffi = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "71eabc78daac558b1381bdbacfff182f69fc7846", features = ["app"] }
leptoskit_native = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "71eabc78daac558b1381bdbacfff182f69fc7846" }
leptoskit_wasm = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "71eabc78daac558b1381bdbacfff182f69fc7846" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
solana_kit_leptoskit = { path = "../../../crates/solana_kit_leptoskit", features = ["wallet-host"] }
solana_kit_native = { path = "../../../crates/solana_kit_native" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
futures = { version = "=0.3.34", default-features = false, features = ["executor", "std"] }
leptoskit_yoga = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "71eabc78daac558b1381bdbacfff182f69fc7846" }
tokio = { version = "=1.54.1", features = ["net", "io-util"] }
wat = "=1.262.0"

[package.metadata.leptoskit.runtime]
name = "solana-journey"
rust-service-factory = "from_app_dirs"
