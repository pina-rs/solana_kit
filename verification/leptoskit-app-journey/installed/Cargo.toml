[package]
name = "solana_kit_installed_wallet_journey"
version = "0.0.0"
edition = "2024"
license = "Unlicense"
publish = false
rust-version = "1.89"
description = "Private OS-driven generated application and validator journey"

[workspace]

[dependencies]
bs58 = "=0.5.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
leptoskit_testing = { version = "=0.3.0", features = ["native-ui"] }
quick-xml = "=0.42.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "=1.0.154"
