[workspace]

[package]
name = "solana_kit_wasi_http_prototype"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
solana_kit_client = { path = "../../crates/solana_kit_client" }
solana_kit_core = { path = "../../crates/solana_kit_core", default-features = false }
solana_kit_wasi = { path = "../../crates/solana_kit_wasi" }
wasip2 = "=1.0.4"

[[bin]]
name = "designs"
path = "src/designs.rs"

[[bin]]
name = "runner"
path = "src/runner.rs"

[[bin]]
name = "embedded"
path = "src/embedded.rs"

[[bin]]
name = "embedded_guest"
path = "src/embedded_guest.rs"

[[bin]]
name = "cli_guest"
path = "src/cli_guest.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
wasmparser = "=0.240.0"
wasmtime = { version = "=50.0.0", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.0", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=50.0.0", default-features = false, features = ["p2"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
http = "=1.5.0"
hyper = { version = "=1.9.0", features = ["client", "http1"] }
http-body-util = "=0.1.3"
wasm-encoder = "=0.261.0"
