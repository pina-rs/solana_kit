[package]
name = "solana_kit_helius_guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "=1.0.154"
solana_kit_helius_portable = { path = "..", default-features = false }

[features]
default = ["crypto"]
crypto = ["solana_kit_helius_portable/crypto"]
unexpected-panic = []
