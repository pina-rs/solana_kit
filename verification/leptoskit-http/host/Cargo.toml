[package]
name = "solana_kit_leptoskit_http_host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
leptoskit_bridge = { version = "=0.3.0" }
leptoskit_native = { version = "=0.3.0" }
leptoskit_wasm = { version = "=0.3.0" }
serde_json = "=1.0.154"
solana_kit_leptoskit = { path = "../../../crates/solana_kit_leptoskit", features = ["host"] }
solana_kit_native = { path = "../../../crates/solana_kit_native" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
wasmparser = "=0.262.0"

[dev-dependencies]
wat = "=1.262.0"
