name: Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MONOCHANGE_VERSION: "0.21.0"

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify release commit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.record.outputs.is_release }}
    steps:

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: detect a new release record
        id: record
        shell: bash
        run: |
          set -euo pipefail
          is_release=false

          if [ "${{ github.event_name }}" = push ]; then
            while IFS= read -r path; do
              case "$path" in
                .monochange/releases/*/release.json) is_release=true ;;
              esac
            done < <(git diff-tree --root --no-commit-id --name-only --diff-filter=A -r HEAD)
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  release-pr:
    name: prepare release pull request
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.is_release != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

      pull-requests: read
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: install formatter
        run: npm install --global dprint@0.64.1

      - name: validate release configuration
        run: |
          monochange step validate
          monochange check

      - name: count pending changesets
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')

          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: open or update the release pull request
        if: steps.pending.outputs.count != '0'

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONOCHANGE_RELEASE_BACKEND: hosted
        run: monochange run release --commit --create-pr

  release-pr-simulated:
    name: rehearse release pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: install formatter
        run: npm install --global dprint@0.64.1

      - name: validate release configuration
        run: |
          monochange step validate
          monochange check

      - name: simulate the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MONOCHANGE_RELEASE_BACKEND: local
        run: |
          monochange run release --dry-run --commit --create-pr

          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          fi

          if [ "$count" -eq 0 ]; then
            echo 'No pending changesets; there is no release pull request to prepare.'
            exit 0
          fi

          monochange run release --commit=false --create-pr=false
          git diff --check
          dprint check --dirty

  release-post-merge:
    name: tag and publish the release
    needs: classify
    if: github.event_name != 'pull_request' && needs.classify.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

      actions: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: confirm the release record
        shell: bash
        run: |
          set -euo pipefail
          is_release="$(monochange step release-record --from HEAD --format json \
            --jq '.resolved_commit == .record_commit')"
          if [ "$is_release" != true ]; then
            echo 'HEAD looks like a release commit but carries no release record.' >&2
            exit 1

          fi

      - name: create release tags
        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step tag-release --from HEAD --push=true --format json

      - name: create draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step publish-release --from-ref=HEAD --draft --format json

      - name: dispatch crate publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$(monochange step release-record --from HEAD --format json \
            | jq -r '[.record.release_targets[] | select(.tag == true) | .tag_name] | map(select(startswith("v"))) | first')"

          if [ -z "$tag" ] || [ "$tag" = null ]; then
            echo 'No primary v* tag in this release record; skipping crates.io publish dispatch.'
            exit 0
          fi

          checkout_ref="$(git rev-parse HEAD)"

          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f package=all -f tag="$tag" -f checkout_ref="$checkout_ref" -f dry_run=false
