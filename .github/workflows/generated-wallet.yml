name: Generated wallet consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_HTTP_USER_AGENT: solana-kit-verification
  GIT_HTTP_USER_AGENT: solana-kit-verification
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.99.1"
  LEPTOSKIT_REVISION: 7437097c52aa68a3401bd378764e051ed4c9165a
  LEPTOSKIT_SOURCE: https://github.com/ifiokjr/leptoskit

jobs:
  generated-wallet-guest:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ifiokjr/leptoskit
          ref: ${{ env.LEPTOSKIT_REVISION }}
          path: framework
          persist-credentials: false

      - name: Install the pinned compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --component clippy --target wasm32-unknown-unknown

      - name: Build the public generator
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --manifest-path framework/Cargo.toml \
            -p leptoskit_cli --bin leptoskit --message-format=json > "$RUNNER_TEMP/cli.jsonl"

      - name: Check the preparation command
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --manifest-path sdk/Cargo.toml \
            --package solana_kit_xtask generated_wallet::

      - name: Execute and lint the composed native runtime
        run: |
          set -euo pipefail
          manifest=sdk/verification/leptoskit-app-journey/runtime/Cargo.toml
          cargo +1.99.1 test --locked --manifest-path "$manifest" --all-targets
          cargo +1.99.1 clippy --locked --manifest-path "$manifest" \
            --all-targets --features generated-wallet-tests -- -D warnings

      - name: Generate and adapt the ordinary wallet consumer
        run: |
          set -euo pipefail
          cli="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "leptoskit" and (.target.kind | index("bin")) != null) |
            .executable | select(. != null)] |
            if length == 1 then .[0] else error("expected one public CLI") end' \
            "$RUNNER_TEMP/cli.jsonl")"
          for fixture in wallet wallet-rpc; do
            app="$RUNNER_TEMP/$fixture-app"
            "$cli" new "$app" --name solana_wallet_app --platform native --native-target macos
            cargo +1.99.1 run --locked --manifest-path sdk/Cargo.toml \
              --package solana_kit_xtask -- "prepare-$fixture" "$app"
            "$cli" migrate --check --file "$app/leptoskit.toml"
          done

      - name: Verify repeatable preparation and ordinary dependency sources
        run: |
          set -euo pipefail
          for fixture in wallet wallet-rpc; do
            app="$RUNNER_TEMP/$fixture-app"
            find "$app" -type f -print0 | sort -z | xargs -0 sha256sum \
              > "$RUNNER_TEMP/$fixture-generated.sha256"
            cargo +1.99.1 run --locked --manifest-path sdk/Cargo.toml \
              --package solana_kit_xtask -- "prepare-$fixture" "$app"
            sha256sum --check "$RUNNER_TEMP/$fixture-generated.sha256"

            cargo +1.99.1 metadata --manifest-path "$app/Cargo.toml" --format-version 1 \
              > "$RUNNER_TEMP/$fixture-consumer-metadata.json"
            jq -e --arg revision "$LEPTOSKIT_REVISION" --arg source "$LEPTOSKIT_SOURCE" '
              [.packages[] | select(.name | startswith("leptoskit")) | .source] |
              unique == ["git+\($source)?rev=\($revision)#\($revision)"]
            ' "$RUNNER_TEMP/$fixture-consumer-metadata.json"
          done

      - name: Compile the generated wallet guest
        run: |
          set -euo pipefail

          for fixture in wallet wallet-rpc; do
            app="$RUNNER_TEMP/$fixture-app"
            cargo +1.99.1 build --locked --manifest-path "$app/Cargo.toml" \
              -p solana_wallet_app_app --no-default-features --features native \
              --target wasm32-unknown-unknown --message-format=json \
              > "$RUNNER_TEMP/$fixture-guest.jsonl"
          done

      - name: Execute the generated guest controls through production wasmi
        run: |
          set -euo pipefail
          guest="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "solana_wallet_app_app") | .filenames[] |
            select(endswith(".wasm"))] |
            if length == 1 then .[0] else error("expected one actual generated guest") end' \
            "$RUNNER_TEMP/wallet-rpc-guest.jsonl")"
          GENERATED_WALLET_WASM="$guest" cargo +1.99.1 test --locked \
            --manifest-path sdk/verification/leptoskit-app-journey/runtime/Cargo.toml \
            --features generated-wallet-tests --test generated_wallet -- --test-threads=1

  generated-wallet-apple:
    name: generated-wallet-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            xcode: "26.2"
            native-target: macos
            driver: mac2
          - platform: ios
            runner: macos-26
            xcode: "26.6"
            native-target: ios-simulator
            driver: xcuitest
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      npm_config_user_agent: solana-kit-verification
      npm_config_audit: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ifiokjr/leptoskit
          ref: ${{ env.LEPTOSKIT_REVISION }}
          path: framework
          persist-credentials: false

      - name: Install the pinned compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --component clippy --target wasm32-unknown-unknown

      - name: Verify the selected iOS test runtime library
        if: matrix.platform == 'ios'
        run: test -f "$DEVELOPER_DIR/Platforms/iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib"

      - name: Install the iOS simulator compiler target
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) target=aarch64-apple-ios-sim ;;
            x86_64) target=x86_64-apple-ios ;;
            *) echo 'Unsupported simulator host architecture' >&2; exit 1 ;;
          esac
          rustup target add --toolchain 1.99.1 "$target"

      - name: Verify the generated app toolchains
        run: |
          cargo --version
          rustc --version
          xcrun swift --version
          xcodebuild -version

      - name: Build the public generator
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --manifest-path framework/Cargo.toml \
            -p leptoskit_cli --bin leptoskit --message-format=json > "$RUNNER_TEMP/cli.jsonl"

      - name: Build the actual generated Apple app and composed registrant
        run: |
          set -euo pipefail
          cli="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "leptoskit" and (.target.kind | index("bin")) != null) |
            .executable | select(. != null)] |
            if length == 1 then .[0] else error("expected one public CLI") end' \
            "$RUNNER_TEMP/cli.jsonl")"
          app="$RUNNER_TEMP/wallet-rpc-app"
          "$cli" new "$app" --name solana_wallet_app --platform native \
            --native-target "${{ matrix.platform }}"
          cargo +1.99.1 run --locked --manifest-path sdk/Cargo.toml \
            --package solana_kit_xtask -- prepare-wallet-rpc "$app"
          "$cli" migrate --check --file "$app/leptoskit.toml"
          cd "$app"
          "$cli" native build "${{ matrix.native-target }}"

          if [ '${{ matrix.platform }}' = ios ]; then
            printf 'native_guest_wasm_bytes=%s\n' "$(wc -c < .leptoskit/ios/bundle/app.wasm)"
            printf 'store_container_bytes=%s\n' "$(wc -c < .leptoskit/ios/mobile/app.lkb)"
          fi

      - name: Build and lint the installed application controller
        run: |
          set -euo pipefail
          manifest=sdk/verification/leptoskit-app-journey/installed/Cargo.toml
          cargo +1.99.1 test --locked --manifest-path "$manifest" --all-targets
          cargo +1.99.1 clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo +1.99.1 build --locked --manifest-path "$manifest" \
            --message-format=json > "$RUNNER_TEMP/installed-controller.jsonl"

      - name: Install the pinned native UI driver and validator
        run: |
          set -euo pipefail
          npm ci --prefix framework/setup/native-ui
          sudo automationmodetool enable-automationmode-without-authentication

          case "$(uname -m)" in
            arm64)
              target=aarch64-apple-darwin
              digest=7552be74cd4eee431de953b8f0761ef3c14bde40c4eadc9d0254d37254144dbd
              ;;
            x86_64)
              target=x86_64-apple-darwin
              digest=88ce81f9b6713f56fae403ccde06e47204746a2d057f4b1d721ce94f1f2328f7
              ;;
            *) echo 'Unsupported validator host architecture' >&2; exit 1 ;;
          esac

          archive="$RUNNER_TEMP/validator.tar.bz2"
          curl --fail --location --user-agent solana-kit-verification \
            "https://github.com/anza-xyz/agave/releases/download/v4.2.0/solana-release-$target.tar.bz2" \
            --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check

          mkdir "$RUNNER_TEMP/validator"
          tar -xjf "$archive" -C "$RUNNER_TEMP/validator"
          rm "$archive"

      - name: Create and install on an owned fresh iOS simulator
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          runtime_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          read -r runtime device_type < <(xcrun simctl list runtimes available --json |
            jq -er --arg version "$runtime_version" '
            [.runtimes[] | select(.platform == "iOS" and .isAvailable and
              (.version | split(".")[:2] | join(".")) == $version)] |
            sort_by(.version | split(".") | map(tonumber)) | last |
            "\(.identifier) \([.supportedDeviceTypes[] |
              select(.name | test("^iPhone [0-9]+$"))] |
              sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .identifier)"')
          test "$runtime" != null
          test "$device_type" != null
          device="$(xcrun simctl create 'Solana Kit installed wallet' "$device_type" "$runtime")"
          printf '%s\n' "$device" > "$RUNNER_TEMP/wallet-ios-device"
          xcrun simctl boot "$device"
          open -Fn -a "$DEVELOPER_DIR/Applications/Simulator.app" \
            --args -CurrentDeviceUDID "$device"
          deadline=$((SECONDS + 900))
          xcrun simctl bootstatus "$device" -b &
          boot=$!
          while kill -0 "$boot" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              kill "$boot"
              wait "$boot" || true
              echo 'Owned simulator boot deadline' >&2
              exit 1
            fi
            sleep 2
          done
          wait "$boot"
          bundle="$RUNNER_TEMP/wallet-rpc-app/.leptoskit/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$device" "$bundle"

      - name: Build the pinned XCTest agent before starting its native session
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          device="$(cat "$RUNNER_TEMP/wallet-ios-device")"
          (
            cd framework
            bash setup/scripts/native_wda_build.sh "$device" "$RUNNER_TEMP/installed-wda"
          ) > "$RUNNER_TEMP/installed-wda.log" 2>&1

      - name: Drive the installed generated app against its owned fresh validator
        run: |
          set -euo pipefail
          controller="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "solana_kit_installed_wallet_journey") |
            .executable | select(. != null)] |
            if length == 1 then .[0] else error("expected one installed controller") end' \
            "$RUNNER_TEMP/installed-controller.jsonl")"

          validator="$RUNNER_TEMP/validator/solana-release/bin/solana-test-validator"
          "$validator" --version
          driver_port=14731
          if lsof -nP -iTCP:"$driver_port" -sTCP:LISTEN; then
            echo 'Dedicated UI driver port is already occupied' >&2
            exit 1
          fi
          (
            cd framework/setup/native-ui
            exec env -u APPIUM_HOME node node_modules/appium/build/lib/main.js \
              --address 127.0.0.1 --port "$driver_port" \
              --use-drivers "${{ matrix.driver }}" --log-no-colors
          ) > "$RUNNER_TEMP/installed-appium.log" 2>&1 &
          server=$!
          cleanup() {
            kill "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 60))
          until curl --fail --silent --noproxy '*' --user-agent solana-kit-verification \
            "http://127.0.0.1:$driver_port/status" | jq -e '.value.ready == true' >/dev/null; do
            kill -0 "$server"
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Owned native UI driver startup timed out' >&2
              exit 1
            fi
            sleep 0.1
          done
          kill -0 "$server"

          arguments=(macos "http://127.0.0.1:$driver_port"
            "$RUNNER_TEMP/wallet-rpc-app/.leptoskit/macos/App.app"
            "$HOME/Library/Application Support/com.leptoskit.solanawalletapp"
            "$RUNNER_TEMP/installed-wallet-run" "$validator")
          if [ '${{ matrix.platform }}' = ios ]; then
            device="$(cat "$RUNNER_TEMP/wallet-ios-device")"
            bundle="$RUNNER_TEMP/wallet-rpc-app/.leptoskit/ios/build/Build/Products/Debug-iphonesimulator/App.app"
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")"
            container="$(xcrun simctl get_app_container "$device" "$identifier" data)"
            arguments=(ios "http://127.0.0.1:$driver_port" "$identifier"
              "$container/Library/Application Support" "$RUNNER_TEMP/installed-wallet-run"
              "$validator" "$device" "$RUNNER_TEMP/installed-wda")
          fi

          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            "$controller" "${arguments[@]}"

      - name: Capture logs for the owned iOS application
        if: always() && matrix.platform == 'ios'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/wallet-ios-device"
          if [ -f "$marker" ]; then
            device="$(cat "$marker")"
            xcrun simctl spawn "$device" log show --style compact --last 5m --info --debug \
              --predicate 'process == "App" OR eventMessage CONTAINS "com.leptoskit.solanawalletapp"' \
              > "$RUNNER_TEMP/installed-ios-app.log"
          fi

      - name: Shut down and delete only the owned simulator
        if: always() && matrix.platform == 'ios'
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/wallet-ios-device"
          if [ -f "$marker" ]; then
            device="$(cat "$marker")"
            status=0
            xcrun simctl shutdown "$device" || status=$?
            xcrun simctl delete "$device" || status=$?
            exit "$status"
          fi

      - name: Retain actual installed app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2

        with:
          name: generated-wallet-installed-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/installed-wallet-run/native-ui
            ${{ runner.temp }}/installed-wallet-run/validator.log
            ${{ runner.temp }}/installed-wallet-run/journey-startup.txt
            ${{ runner.temp }}/installed-appium.log
            ${{ runner.temp }}/installed-wda.log
            ${{ runner.temp }}/installed-ios-app.log

  generated-wallet-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NDK_VERSION: 27.1.12297006
      npm_config_user_agent: solana-kit-verification
      npm_config_audit: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ifiokjr/leptoskit
          ref: ${{ env.LEPTOSKIT_REVISION }}
          path: framework
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the pinned compiler and Android targets
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal \
            --component clippy --target wasm32-unknown-unknown
          rustup target add --toolchain 1.99.1 x86_64-linux-android

      - name: Install the generated Android host toolchains
        run: |
          set -euo pipefail
          bash framework/setup/scripts/android_sdk_install.sh "ndk;$NDK_VERSION" \
            "platforms;android-35" "build-tools;36.0.0" "build-tools;37.0.0" \
            "cmake;3.22.1" emulator "system-images;android-35;default;x86_64" platform-tools
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the public generator and installed controller
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --manifest-path framework/Cargo.toml \
            -p leptoskit_cli --bin leptoskit --message-format=json > "$RUNNER_TEMP/cli.jsonl"
          manifest=sdk/verification/leptoskit-app-journey/installed/Cargo.toml
          cargo +1.99.1 test --locked --manifest-path "$manifest" --all-targets
          cargo +1.99.1 clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
          cargo +1.99.1 build --locked --manifest-path "$manifest" \
            --message-format=json > "$RUNNER_TEMP/installed-controller.jsonl"

      - name: Build the ordinary generated Android app and composed runtime
        run: |
          set -euo pipefail
          cli="$(jq -sre '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "leptoskit" and (.target.kind | index("bin")) != null) |
            .executable | select(. != null)] |
            if length == 1 then .[0] else error("expected one public CLI") end' \
            "$RUNNER_TEMP/cli.jsonl")"
          app="$RUNNER_TEMP/wallet-rpc-app"
          "$cli" new "$app" --name solana_wallet_app --platform native --native-target android
          cargo +1.99.1 run --locked --manifest-path sdk/Cargo.toml \
            --package solana_kit_xtask -- prepare-wallet-rpc "$app"
          "$cli" migrate --check --file "$app/leptoskit.toml"
          cd "$app"
          "$cli" native build android-x86_64

      - name: Install the pinned Android UI driver and validator
        run: |
          set -euo pipefail
          npm ci --prefix framework/setup/native-ui
          archive="$RUNNER_TEMP/validator.tar.bz2"
          curl --fail --location --user-agent solana-kit-verification \
            https://github.com/anza-xyz/agave/releases/download/v4.2.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$archive"
          printf '%s  %s\n' \
            1f5eb13bcf3694dbd3cf634602aee5edcf8eab519acac75778391c979c3002b0 "$archive" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/validator"
          tar -xjf "$archive" -C "$RUNNER_TEMP/validator"
          rm "$archive"

      - name: Enable the owned emulator accelerator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the installed generated Android app on a fresh emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: solana-kit-wallet
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash sdk/verification/leptoskit-app-journey/installed/run_android.sh

      - name: Retain actual Android app evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-wallet-installed-android
          path: |
            ${{ runner.temp }}/installed-wallet-run/native-ui
            ${{ runner.temp }}/installed-wallet-run/validator.log
            ${{ runner.temp }}/installed-appium.log
