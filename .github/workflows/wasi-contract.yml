name: WASI Preview 2 contract

on:
  pull_request:
    paths:
      - verification/wasi-contract/**
      - docs/verification/wasi-contract.md
      - .github/workflows/wasi-contract.yml
      - rust-toolchain.toml
      - monostyle.toml
  push:
    branches: [main]
    paths:
      - verification/wasi-contract/**
      - .github/workflows/wasi-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Wasmtime
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
          contract_host="$RUNNER_TEMP/wasi-contract-host"
          mkdir "$contract_host"
          curl --fail --silent --show-error --location --user-agent wasi-contract-verifier https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz --output "$contract_host/host.tar.xz"
          printf '%s  %s\n' 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff "$contract_host/host.tar.xz" | sha256sum --check --strict
          tar -xf "$contract_host/host.tar.xz" --strip-components=1 -C "$contract_host"
      - name: Check and execute component
        shell: bash
        run: |
          cargo fmt --manifest-path verification/wasi-contract/Cargo.toml --all --check
          cargo test --locked --manifest-path verification/wasi-contract/Cargo.toml -p solana_kit_wasi_contract_runner
          cargo clippy --locked --manifest-path verification/wasi-contract/Cargo.toml -p solana_kit_wasi_contract_runner --all-targets -- -D warnings
          cargo build --locked --manifest-path verification/wasi-contract/Cargo.toml -p solana_kit_wasi_contract_guest --target wasm32-wasip2
          cargo clippy --locked --manifest-path verification/wasi-contract/Cargo.toml -p solana_kit_wasi_contract_guest --target wasm32-wasip2 -- -D warnings
          cargo run --locked --manifest-path verification/wasi-contract/Cargo.toml -p solana_kit_wasi_contract_runner -- "$RUNNER_TEMP/wasi-contract-host/wasmtime"
          cargo install monostyle --version 0.3.26 --locked
          monostyle check verification/wasi-contract --include-generated --fail-under 90
