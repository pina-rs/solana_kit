name: Typed RPC design

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-protocol:
    strategy:
      matrix:
        os: ["ubuntu-24.04", "macos-15", "windows-2025"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Verify actual generic futures, JSON boundaries and loopback cancellation
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.99.1 fmt --manifest-path verification/rpc-design/Cargo.toml --check

          cargo +1.99.1 clippy --manifest-path verification/rpc-design/Cargo.toml --all-targets \
            --locked -- -D warnings

          cargo +1.99.1 test --manifest-path verification/rpc-design/Cargo.toml --locked

          cargo +1.99.1 test -p solana_kit_client --all-features --locked

          cargo +1.99.1 doc -p solana_kit_client --no-deps --locked

      - name: Check exact subscription declaration receipt
        shell: bash
        run: |
          rustc +1.99.1 --edition "2024" verification/subscriptions-design/receipt.rs -o \
            target/subscription-receipt

          target/subscription-receipt docs/parity/capabilities.tsv target/subscriptions.tsv

          cmp docs/parity/subscriptions.tsv target/subscriptions.tsv
  catalog:
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openbudgetfun/solana_kit
          ref: 0138bb956d2d81ccc0c56edc602401c0df2f2b46
          path: .monochange/local/rpc-reference
          persist-credentials: false

      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Check exact catalog deterministically and reject a missing row
        run: |
          cargo +1.99.1 run --manifest-path verification/rpc-design/Cargo.toml --bin catalog \
            --locked -- .monochange/local/rpc-reference

          cargo +1.99.1 run --manifest-path verification/rpc-design/Cargo.toml --bin catalog \
            --locked -- .monochange/local/rpc-reference

          cp docs/parity/rpc-catalog.tsv "$RUNNER_TEMP/rpc-catalog.tsv"

          trap 'cp "$RUNNER_TEMP/rpc-catalog.tsv" docs/parity/rpc-catalog.tsv' EXIT

          sed -i '2d' docs/parity/rpc-catalog.tsv

          if cargo +1.99.1 run --manifest-path verification/rpc-design/Cargo.toml --bin catalog \
            --locked -- .monochange/local/rpc-reference; then
            echo 'missing row control unexpectedly passed' >&2

            exit 1
          fi
  client-portability:
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public client MSRV and all three Wasm targets
        run: |
          rustup toolchain install 1.89.0 --profile minimal

          cargo +1.89.0 check -p solana_kit_client --locked

          rustup toolchain install 1.99.1 --profile minimal

          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2

          cargo +1.99.1 check -p solana_kit_client --target wasm32-unknown-unknown --locked

          cargo +1.99.1 check -p solana_kit_client --target wasm32-wasip1 --locked

          cargo +1.99.1 check -p solana_kit_client --target wasm32-wasip2 --locked
