name: Planning integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ledger and Rust formatting
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          rustfmt +1.99.1 --edition 2024 --check tools/check_plan.rs
          rustc +1.99.1 --edition=2024 -D warnings tools/check_plan.rs -o "$RUNNER_TEMP/check-plan"
          "$RUNNER_TEMP/check-plan"
          cargo +1.99.1 check --workspace --locked
          cargo +1.99.1 package -p solana_kit --locked
      - name: Enforce monostyle 90 in both categories
        shell: bash
        run: |
          cargo +1.99.1 install monostyle --version 0.3.26 --locked
          monostyle check . --fail-under 90 --no-color
