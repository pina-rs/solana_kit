name: WASI HTTP adapter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview2-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchains and host
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-wasip2
          rustup toolchain install 1.89.0 --profile minimal --target wasm32-wasip2
          kit_host="$RUNNER_TEMP/kit-wasi-host"
          mkdir "$kit_host"
          curl --fail --silent --show-error --location --user-agent wasi-http-verifier https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz --output "$kit_host/host.tar.xz"
          printf '%s  %s\n' 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff "$kit_host/host.tar.xz" | sha256sum --check --strict
          tar -xf "$kit_host/host.tar.xz" --strip-components=1 -C "$kit_host"
      - name: Verify production transport and actual component
        shell: bash
        run: |
          cargo +1.99.1 fmt --all --check
          cargo +1.99.1 fmt --manifest-path verification/wasi-http-prototype/Cargo.toml --all --check
          cargo +1.89.0 check -p solana_kit_wasi --locked --target wasm32-wasip2
          cargo +1.99.1 clippy -p solana_kit_wasi --locked --target wasm32-wasip2 -- -D warnings
          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin runner --locked -- -D warnings
          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin solana_kit_wasi_http_prototype --target wasm32-wasip2 --locked -- -D warnings
          cargo +1.99.1 build --manifest-path verification/wasi-http-prototype/Cargo.toml --bin solana_kit_wasi_http_prototype --target wasm32-wasip2 --locked
          cargo +1.99.1 run --manifest-path verification/wasi-http-prototype/Cargo.toml --bin runner --locked -- "$RUNNER_TEMP/kit-wasi-host/wasmtime"
      - name: Verify embedded host and MSRV component execution
        shell: bash
        run: |
          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin embedded --locked -- -D warnings
          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin embedded_guest --target wasm32-wasip2 --locked -- -D warnings
          cargo +1.99.1 build --manifest-path verification/wasi-http-prototype/Cargo.toml --bin embedded_guest --target wasm32-wasip2 --locked
          cargo +1.99.1 run --manifest-path verification/wasi-http-prototype/Cargo.toml --bin embedded --locked
          cargo +1.89.0 build --manifest-path verification/wasi-http-prototype/Cargo.toml --bin embedded_guest --target wasm32-wasip2 --locked
          verification/wasi-http-prototype/target/debug/embedded
