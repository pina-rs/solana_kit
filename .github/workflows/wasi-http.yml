name: WASI HTTP adapter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HTTP_USER_AGENT: solana-kit-verification
  GIT_HTTP_USER_AGENT: solana-kit-verification

jobs:
  preview2-http:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchains and host
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy \
            --target wasm32-wasip2

          rustup toolchain install 1.89.0 --profile minimal --target wasm32-wasip2

          kit_host="$RUNNER_TEMP/kit-wasi-host"

          mkdir "$kit_host"

          curl --fail --silent --show-error --location --user-agent wasi-http-verifier \
            https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/\
          wasmtime-v50.0.0-x86_64-linux.tar.xz \
            --output "$kit_host/host.tar.xz"

          printf '%s  %s\n' 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff \
            "$kit_host/host.tar.xz" | sha256sum --check --strict

          tar -xf "$kit_host/host.tar.xz" --strip-components=1 -C "$kit_host"

      - name: Verify production transport and actual component
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo +1.99.1 fmt --all --check

          cargo +1.99.1 fmt --manifest-path verification/wasi-http-prototype/Cargo.toml --all \
            --check

          cargo +1.89.0 check -p solana_kit_wasi --locked --target wasm32-wasip2

          cargo +1.99.1 clippy -p solana_kit_wasi --locked --target wasm32-wasip2 -- -D warnings

          cargo +1.99.1 doc -p solana_kit_wasi --locked --target wasm32-wasip2 --no-deps

          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            runner --locked -- -D warnings

          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            solana_kit_wasi_http_prototype --target wasm32-wasip2 --locked -- -D warnings

          cargo +1.99.1 build --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            solana_kit_wasi_http_prototype --target wasm32-wasip2 --locked \
            --message-format=json > "$RUNNER_TEMP/http-component.json"
          component="$(jq -sre '
            [.[] | select(.reason == "compiler-artifact" and
              .target.name == "solana_kit_wasi_http_prototype" and
              (.manifest_path | endswith("/wasi-http-prototype/Cargo.toml")) and
              (.target.kind | index("bin")) != null) | .filenames[] |
              select(endswith(".wasm"))] |
            if length == 1 then .[0] else error("expected one HTTP component") end
          ' "$RUNNER_TEMP/http-component.json")"
          test -f "$component"

          cargo +1.99.1 run --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            runner --locked -- "$RUNNER_TEMP/kit-wasi-host/wasmtime" "$component"

      - name: Verify embedded host and MSRV component execution
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            embedded --locked -- -D warnings

          cargo +1.99.1 test --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            embedded --locked

          cargo +1.99.1 clippy --manifest-path verification/wasi-http-prototype/Cargo.toml --bin \
            embedded_guest --target wasm32-wasip2 --locked -- -D warnings

          for compiler in 1.99.1 1.89.0; do
            cargo +"$compiler" build --manifest-path verification/wasi-http-prototype/Cargo.toml \
              --bin embedded_guest --bin cli_guest --target wasm32-wasip2 --locked \
              --message-format=json > "$RUNNER_TEMP/embedded-components.json"
            for guest in embedded_guest cli_guest; do
              component="$(jq -sre --arg name "$guest" '
                [.[] | select(.reason == "compiler-artifact" and .target.name == $name and
                  (.manifest_path | endswith("/wasi-http-prototype/Cargo.toml")) and
                  (.target.kind | index("bin")) != null) | .filenames[] |
                  select(endswith(".wasm"))] |
                if length == 1 then .[0] else error("expected one embedded component") end
              ' "$RUNNER_TEMP/embedded-components.json")"
              test -f "$component"
              export SOLANA_KIT_WASI_HTTP_GUEST="$component"
              arguments=()
              if [ "$guest" = cli_guest ]; then arguments+=(--cli-only); fi
              cargo +1.99.1 run --manifest-path verification/wasi-http-prototype/Cargo.toml \
                --bin embedded --locked -- "${arguments[@]}"
            done
          done
