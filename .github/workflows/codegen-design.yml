name: Generator design verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  private-generator:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust tools
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Check private generator formatting and lints
        shell: bash
        run: |
          cargo +1.99.1 fmt --manifest-path verification/codegen-design/Cargo.toml --check

          cargo +1.99.1 clippy --locked --manifest-path verification/codegen-design/Cargo.toml \
            --all-targets -- -D warnings

      - name: Install pinned generated-output style tool
        shell: bash
        run: cargo +1.99.1 install monostyle --version 0.3.26 --locked

      - name: Score every generated corpus source
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            generated-style

      - name: Run private generator regression tests
        shell: bash
        run: cargo +1.99.1 test --locked --manifest-path verification/codegen-design/Cargo.toml

      - name: Regenerate twice and reject committed output drift
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            generate

          git diff --exit-code -- verification/codegen-design/src/generated.rs

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            generate

          git diff --exit-code -- verification/codegen-design/src/generated.rs

      - name: Execute independent literal byte proof
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- proof

      - name: Regenerate public System data and reject drift
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system

          git diff --exit-code -- crates/solana_kit_system/src/generated.rs

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-receipt

          git diff --exit-code -- docs/parity/system-data.tsv

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system

          git diff --exit-code -- crates/solana_kit_system/src/generated.rs

      - name: Regenerate System client artifacts twice and reject drift
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-builders

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-errors

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-client-receipt

          git diff --exit-code -- crates/solana_kit_system/src/builders.rs \
            crates/solana_kit_system/src/errors.rs docs/parity/system-client.tsv

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-builders

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            system-errors

          git diff --exit-code -- crates/solana_kit_system/src/builders.rs \
            crates/solana_kit_system/src/errors.rs

      - name: Check program portability and documentation
        shell: bash
        run: |
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2

          cargo +1.99.1 check -p solana_kit_system --locked --target wasm32-unknown-unknown

          cargo +1.99.1 check -p solana_kit_system --locked --target wasm32-wasip1

          cargo +1.99.1 check -p solana_kit_system --locked --target wasm32-wasip2

          RUSTDOCFLAGS='-D warnings' cargo +1.99.1 doc -p solana_kit_system --locked --no-deps

          rustup toolchain install 1.89.0 --profile minimal

          cargo +1.89.0 check -p solana_kit_system --locked

      - name: Regenerate Compute Budget and reject drift
        shell: bash
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            compute-budget

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            compute-budget-receipt

          git diff --exit-code -- crates/solana_kit_compute_budget/src/generated.rs \
            docs/parity/compute-budget.tsv

          cargo +1.99.1 run --locked --manifest-path verification/codegen-design/Cargo.toml -- \
            compute-budget

          git diff --exit-code -- crates/solana_kit_compute_budget/src/generated.rs

      - name: Verify portable Compute Budget client
        shell: bash
        run: |
          cargo +1.99.1 test -p solana_kit_compute_budget --locked

          cargo +1.99.1 check -p solana_kit_compute_budget --locked --target wasm32-unknown-unknown

          cargo +1.99.1 check -p solana_kit_compute_budget --locked --target wasm32-wasip1

          cargo +1.99.1 check -p solana_kit_compute_budget --locked --target wasm32-wasip2

          cargo +1.89.0 test -p solana_kit_compute_budget --locked

          RUSTDOCFLAGS='-D warnings' cargo +1.99.1 doc -p solana_kit_compute_budget --locked \
            --no-deps
