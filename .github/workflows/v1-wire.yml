name: Private v1 wire proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  codec-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Test private wire oracle and malformed boundaries
        run: |
          cargo +1.99.1 fmt --manifest-path verification/v1-wire/Cargo.toml --check
          cargo +1.99.1 test --manifest-path verification/v1-wire/Cargo.toml --locked
          cargo +1.99.1 clippy --manifest-path verification/v1-wire/Cargo.toml --all-targets --locked -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +1.99.1 doc --manifest-path verification/v1-wire/Cargo.toml --no-deps --locked
