name: LeptosKit async guest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actual-host:
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned guest toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy \
            --target wasm32-unknown-unknown

      - name: Build required real Rust guest
        run: |
          cargo +1.99.1 build --locked --manifest-path verification/leptoskit-async/Cargo.toml -p \
            solana_kit_leptoskit_async_guest --target wasm32-unknown-unknown

      - name: Execute canonical and failing controls in pinned actual host
        run: |
          cargo +1.99.1 run --locked --manifest-path verification/leptoskit-async/Cargo.toml -p \
            solana_kit_leptoskit_async_host -- \
            verification/leptoskit-async/target/wasm32-unknown-unknown/debug/\
          solana_kit_leptoskit_async_guest.wasm

      - name: Test compiled ABI and rejection gates
        run: |
          cargo +1.99.1 test --locked --manifest-path verification/leptoskit-async/Cargo.toml \
            --workspace

      - name: Check private source
        run: |
          cargo +1.99.1 fmt --manifest-path verification/leptoskit-async/Cargo.toml --all --check

          cargo +1.99.1 clippy --locked --manifest-path verification/leptoskit-async/Cargo.toml \
            --workspace --all-targets -- -D warnings

          cargo +1.99.1 clippy --locked --manifest-path verification/leptoskit-async/Cargo.toml -p \
            solana_kit_leptoskit_async_guest --target wasm32-unknown-unknown -- -D warnings
