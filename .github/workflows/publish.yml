name: Publish packages

# One workflow owns the release: it refreshes the release pull request, tags a
# merged release commit, and then validates and publishes the resulting crates
# and npm package in the same run. A tag pushed with GITHUB_TOKEN cannot
# trigger another workflow, so publishing is wired here directly rather than
# dispatched to a second workflow.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace crate to publish, or `all` for a release tag"
        required: false
        type: string
        default: "all"

      tag:
        description: "Release tag for an all-crate publish (for example v0.2.0)"
        required: false
        type: string

      checkout_ref:
        description: "Commit SHA to build for an all-crate publish"
        required: false
        type: string

      dry_run:
        description: "Verify the packaged crates without publishing"
        required: false
        type: boolean
        default: true

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

permissions:
  contents: read

concurrency:
  group: publishing-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MONOCHANGE_VERSION: "0.21.0"
  CARGO_HTTP_USER_AGENT: solana-kit-publishing
  GIT_HTTP_USER_AGENT: solana-kit-publishing

jobs:
  # A push to main either refreshes the release pull request or, when the
  # merged commit carries a release record, hands the release to the tag job.
  prepare:
    name: prepare release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      is_release: ${{ steps.record.outputs.is_release }}
      tag: ${{ steps.record.outputs.tag }}
      sha: ${{ steps.record.outputs.sha }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: install formatter
        run: npm install --global dprint@0.64.1

      - name: validate release configuration
        run: |
          monochange step validate
          monochange check

      # `release-record` resolves the record commit for HEAD, so a release
      # merged with a merge commit is detected just like a squashed release.
      # The old diff-tree check only saw added paths in the merge diff and
      # silently skipped releases merged with --no-ff.
      - name: detect current release commit
        id: record
        shell: bash
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          release_record_error="$(mktemp)"
          status=0
          is_release="$(monochange step release-record --from HEAD --format json \
            --jq '.resolved_commit == .record_commit' 2>"$release_record_error")" || status=$?

          if [ "$status" -eq 0 ] && [ "$is_release" = true ]; then
            tag="$(monochange step release-record --from HEAD --format json \
              | jq -r '[.record.release_targets[] | select(.tag == true)] | sort_by(.tag_name | startswith("v") | not) | first | .tag_name // empty')"
            if [ -z "$tag" ]; then
              echo 'The release record does not contain a publishable tag.' >&2
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail loudly instead of silently skipping release automation when a
          # commit looks like a release but its record cannot be read.
          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%B)"
          if [[ "$subject" == chore\(release\):\ prepare\ release* ]] ||
            grep -q '<!-- monochange:release-record:start -->' <<<"$body"; then
            echo '::error::Release-looking commit could not be read as a release record; failing instead of silently skipping release automation.'
            cat "$release_record_error" >&2
            exit 1
          fi

          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "tag=" >> "$GITHUB_OUTPUT"

      - name: count pending changesets
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: open or update the release pull request
        if: steps.record.outputs.is_release != 'true' && steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONOCHANGE_RELEASE_BACKEND: hosted
        run: monochange run release --commit --create-pr

  release-pr-simulated:
    name: rehearse release pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: install formatter
        run: npm install --global dprint@0.64.1

      - name: validate release configuration
        run: |
          monochange step validate
          monochange check

      - name: simulate the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MONOCHANGE_RELEASE_BACKEND: local
        run: |
          monochange run release --dry-run --commit --create-pr

          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          fi

          if [ "$count" -eq 0 ]; then
            echo 'No pending changesets; there is no release pull request to prepare.'
            exit 0
          fi

          monochange run release --commit=false --create-pr=false
          git diff --check
          dprint check --dirty

  # Only a release commit merged to main reaches this job. Manual dispatches
  # and tag pushes never create tags: they publish an existing tag instead.
  tag:
    name: tag and create draft releases
    needs: prepare
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # Keep the checkout token so tag-release can push tags with it.
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-$MONOCHANGE_VERSION"
          base="https://github.com/monochange/monochange/releases/download"
          release="v${MONOCHANGE_VERSION}"
          archive="monochange-x86_64-unknown-linux-gnu-${release}.tar.gz"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            "${base}/${release}/${archive}" \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: confirm the release record
        shell: bash
        run: |
          set -euo pipefail
          is_release="$(monochange step release-record --from HEAD --format json \
            --jq '.resolved_commit == .record_commit')"
          if [ "$is_release" != true ]; then
            echo 'HEAD looks like a release commit but carries no release record.' >&2
            exit 1
          fi

      - name: create release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step tag-release --from HEAD --push=true --format json

      - name: create draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: monochange step publish-release --from-ref=HEAD --draft --format json

  # Runs for a release commit on main, a v* tag push, or a manual dispatch with
  # a tag. The selected tag and commit are resolved here once and passed to the
  # publish jobs through job outputs.
  validate:
    name: validate packages
    needs:
      - prepare
      - tag
    if: >-
      always() &&
      needs.tag.result != 'failure' &&
      needs.tag.result != 'cancelled' &&
      (
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.prepare.result == 'success' &&
          needs.prepare.outputs.is_release == 'true'
        )
      )
    runs-on: "ubuntu-24.04"
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PACKAGE: ${{ inputs.package || 'all' }}
      TAG: ${{ inputs.tag || needs.prepare.outputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      package: ${{ steps.resolve.outputs.package }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      release_tags: ${{ steps.record.outputs.tags }}
    steps:
      - name: checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag || needs.prepare.outputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: resolve release identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tag=$TAG"
            echo "sha=$(git rev-parse HEAD)"
            echo "package=$PACKAGE"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: validate crate selection
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PACKAGE" = all ]; then
            case "$TAG" in
              v*) ;;
              *) echo 'An all-crate publish needs a v* release tag.' >&2; exit 1 ;;
            esac

            exit 0
          fi

          case "$PACKAGE" in
            solana_kit|solana_kit_*) ;;
            *) echo 'Select a Solana Kit workspace crate or all.' >&2; exit 1 ;;
          esac

          test -f "crates/$PACKAGE/Cargo.toml"

      - name: install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: install monochange
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/monochange-0.21.0"
          mkdir -p "$directory"

          curl --fail --location --silent --show-error \
            https://github.com/monochange/monochange/releases/download/v0.21.0/\
          monochange-x86_64-unknown-linux-gnu-v0.21.0.tar.gz \
            --output "$directory/monochange.tar.gz"

          printf '%s  %s\n' 3d79ea6d683b48ad6760f5ed60101022b8383b48e15eba49bd400fb53fed4afb \
            "$directory/monochange.tar.gz" | sha256sum --check --strict

          tar -xzf "$directory/monochange.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"

      - name: read release targets
        id: record
        shell: bash
        run: |
          set -euo pipefail
          tags="$(monochange step release-record --from HEAD --format json \
            | jq -c '[.record.release_targets[] | select(.release == true) | .tag_name]')"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: verify packaged crates

        shell: bash
        run: |
          set -euo pipefail

          if [ "$PACKAGE" != all ]; then
            cargo +1.99.1 publish --locked --dry-run --package "$PACKAGE"
            exit 0
          fi

          mapfile -t unpublished < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == []) | .name'
          )

          excludes=()
          for package in "${unpublished[@]}"; do
            excludes+=("--exclude" "$package")
          done

          excludes+=("--exclude" solana_kit)
          cargo +1.99.1 package --workspace --locked "${excludes[@]}"

  publish:
    name: publish packages
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.tag != ''
    runs-on: "ubuntu-24.04"
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA: ${{ needs.validate.outputs.sha }}
      PACKAGE: ${{ needs.validate.outputs.package }}
      DRY_RUN: ${{ needs.validate.outputs.dry_run }}

    steps:
      - name: checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: authenticate with crates.io
        if: env.DRY_RUN != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: publish crates
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          if [ "$PACKAGE" != all ]; then
            cargo +1.99.1 publish --locked --package "$PACKAGE"
            exit 0
          fi

          mapfile -t unpublished < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == []) | .name'
          )

          excludes=()
          for package in "${unpublished[@]}"; do
            excludes+=("--exclude" "$package")
          done

          excludes+=("--exclude" solana_kit)
          cargo +1.99.1 publish --workspace --locked --no-verify "${excludes[@]}"

      - name: publish draft releases
        if: env.DRY_RUN != 'true' && env.PACKAGE == 'all'

        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAGS: ${{ needs.validate.outputs.release_tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          done < <(jq -r '.[]' <<< "$RELEASE_TAGS")

          # Publishing the namespaced releases above can make the newest one
          # latest. The primary v* release is the SDK release users should see.
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  publish-npm:
    name: publish Codama npm package
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.package == 'all'
    runs-on: "ubuntu-24.04"
    timeout-minutes: 60
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    env:
      TAG: ${{ needs.validate.outputs.tag }}
      SHA: ${{ needs.validate.outputs.sha }}
      PACKAGE: ${{ needs.validate.outputs.package }}
      DRY_RUN: ${{ needs.validate.outputs.dry_run }}
      PACKAGE_DIRECTORY: packages/codama-renderers-rust-solana-kit
      PACKAGE_NAME: codama-renderers-rust-solana-kit
      CARGO_HTTP_USER_AGENT: solana-kit-verification
      GIT_HTTP_USER_AGENT: solana-kit-verification
      npm_config_user_agent: solana-kit-verification

    steps:
      - name: checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity before any build
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./$PACKAGE_DIRECTORY/package.json').version")"
          expected_tag="v${version}"

          if [ "$TAG" != "$expected_tag" ]; then
            echo "Release tag $TAG does not match package version $version ($expected_tag)." >&2
            exit 1
          fi

          # Release handoff checks out the release commit SHA while publishing
          # from main; resolve the primary tag and require the same commit.
          if [ "$DRY_RUN" = "true" ]; then
            if git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"; then
              test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG}^{commit}")"
            fi
          else
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG}^{commit}")"
            git fetch --no-tags origin main
            git merge-base --is-ancestor HEAD origin/main
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'expected_tag=%s\n' "$expected_tag" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require a trusted-publishing capable npm CLI
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version
          node -e '
            const { execFileSync } = require("node:child_process");
            const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" })
              .trim()
              .split(".")
              .map(Number);

            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm 11.5.1 or later is required for trusted publishing.");
              process.exit(1);
            }
          '

      - name: Prepare pinned compiler and dependencies
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustup toolchain install 1.89.0 --profile minimal --component clippy
          rustup target add --toolchain 1.99.1 wasm32-wasip1

          cargo +1.99.1 fetch --locked --manifest-path tools/codama-renderer/Cargo.toml
          cargo +1.89.0 fetch --manifest-path verification/codama-consumer/Cargo.toml

          cd "$PACKAGE_DIRECTORY"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build accepted formatter inputs
        shell: bash
        env:
          MONOSTYLE_REVISION: ae86916d5055fb2c15f665bbe4f0f90bd8abc26e
          MONOSTYLE_TREE: d6157d0cc5892f6cf28ea9a0b3b1d7610a4cf23f
          TYPESCRIPT_SHA256: 9c52244de2c25a33addc7ddacff4443234a2dc4b5d3f34131262d1e0df35007c
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/monostyle-source"
          tools_dir="$RUNNER_TEMP/renderer-tools"
          plugin="$RUNNER_TEMP/typescript-0.96.1.wasm"

          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/ifiokjr/monostyle.git
          git -C "$source_dir" fetch --depth=1 origin "$MONOSTYLE_REVISION"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$MONOSTYLE_REVISION"
          test "$(git -C "$source_dir" rev-parse 'HEAD^{tree}')" = "$MONOSTYLE_TREE"

          cargo +1.99.1 build --locked --release --manifest-path "$source_dir/Cargo.toml" \
            --package monostyle --bin monostyle --target-dir "$RUNNER_TEMP/monostyle-target"
          mkdir -p "$tools_dir/bin"
          install -m u=rwx,go=rx "$RUNNER_TEMP/monostyle-target/release/monostyle" "$tools_dir/bin/monostyle"
          cargo +1.99.1 install dprint --version 0.60.1 --locked --root "$tools_dir"

          curl --fail --silent --show-error --user-agent solana-kit-verification \
            https://plugins.dprint.dev/typescript-0.96.1.wasm --output "$plugin"
          printf '%s  %s\n' "$TYPESCRIPT_SHA256" "$plugin" | sha256sum --check --strict

          {
            echo "MONOSTYLE=$tools_dir/bin/monostyle"
            echo "MONOSTYLE_CONFIG=$GITHUB_WORKSPACE/monostyle.toml"
            echo "DPRINT=$tools_dir/bin/dprint"
            echo "DPRINT_TYPESCRIPT_PLUGIN=$plugin"
          } >> "$GITHUB_ENV"

      - name: Build, test and pack the real bundled engine
        working-directory: packages/codama-renderers-rust-solana-kit
        shell: bash
        run: |
          set -euo pipefail

          toolchain_bin="$(dirname "$(rustup which --toolchain 1.99.1 rustc)")"
          export PATH="$toolchain_bin:$PATH"
          export CARGO="$toolchain_bin/cargo"
          export RUSTC="$toolchain_bin/rustc"
          export RUSTDOC="$toolchain_bin/rustdoc"
          command -v cargo cargo-clippy clippy-driver rustc rustdoc

          npm run build
          npm run typecheck
          npm test
          npm run format:dist
          npm run check:package

          archive="$GITHUB_WORKSPACE/codama-renderers-rust-solana-kit-${version}.tgz"
          npm pack --ignore-scripts --offline
          mv "codama-renderers-rust-solana-kit-${version}.tgz" "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_ENV"

          test "$(tar -xOf "$archive" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));
          ')" = "$version"
          test "$(tar -tzf "$archive" | wc -l)" -eq 72
          sha256sum "$archive"

      - name: Execute the archive-only packed consumer
        working-directory: packages/codama-renderers-rust-solana-kit
        shell: bash
        run: |
          set -euo pipefail

          toolchain_bin="$(dirname "$(rustup which --toolchain 1.99.1 rustc)")"
          export PATH="$toolchain_bin:$PATH"
          export CARGO="$toolchain_bin/cargo"
          export RUSTC="$toolchain_bin/rustc"
          export RUSTDOC="$toolchain_bin/rustdoc"
          command -v cargo cargo-clippy clippy-driver rustc rustdoc

          npm run test:packed -- "$archive"

      - name: Execute the same generated client on the minimum Rust version
        working-directory: packages/codama-renderers-rust-solana-kit
        shell: bash
        run: |
          set -euo pipefail

          toolchain_bin="$(dirname "$(rustup which --toolchain 1.89.0 rustc)")"
          export PATH="$toolchain_bin:$PATH"
          export CARGO="$toolchain_bin/cargo"
          export RUSTC="$toolchain_bin/rustc"
          export RUSTDOC="$toolchain_bin/rustdoc"
          command -v cargo cargo-clippy clippy-driver rustc rustdoc
          rustc --version --verbose

          npm run test:packed -- "$archive"

      - name: Verify archive identity, inventory and privacy before upload
        shell: bash
        run: |
          set -euo pipefail

          test "$(tar -xOf "$archive" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));
          ')" = "$version"
          test "$(tar -xOf "$archive" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).name));
          ')" = "$PACKAGE_NAME"
          test "$(tar -tzf "$archive" | wc -l)" -eq 72

          if tar -tzf "$archive" | grep -E '(^|/)(src|test|target|node_modules)/'; then
            echo "The archive contains development paths." >&2
            exit 1
          fi

          tar -xOf "$archive" package/engine/renderer.wasm > "$RUNNER_TEMP/renderer.wasm"
          node -e '
            const fs = require("node:fs");
            const module = new WebAssembly.Module(fs.readFileSync(process.env.RUNNER_TEMP + "/renderer.wasm"));
            const modules = new Set(WebAssembly.Module.imports(module).map((item) => item.module));

            if (modules.size !== 1 || !modules.has("wasi_snapshot_preview1")) {
              console.error("Unexpected engine import modules:", [...modules]);
              process.exit(1);
            }
          '

          if tar -xOf "$archive" package/README.md package/THIRD_PARTY_NOTICES.md 2>/dev/null \
            | grep -E '/(Users|home)/'; then
            echo "The archive contains a personal filesystem prefix." >&2
            exit 1
          fi

      - name: Dry-run the exact archive with a credential-free npm config
        if: env.DRY_RUN == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          NPM_CONFIG_GLOBALCONFIG: /dev/null
        run: |
          set -euo pipefail

          printf '%s\n' 'user-agent=build' > "$NPM_CONFIG_USERCONFIG"
          if grep -v '^user-agent=build$' "$NPM_CONFIG_USERCONFIG"; then
            echo "The dry-run npm config must not contain credentials." >&2
            exit 1
          fi

          npm publish "$archive" --dry-run --ignore-scripts --access public

      - name: Publish the qualified archive
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          NPM_CONFIG_GLOBALCONFIG: /dev/null
          # Optional one-shot bootstrap for the first upload. Prefer deleting
          # this secret after the package exists and trusted publishing works.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          test "$DRY_RUN" = "false"
          test "$TAG" = "$expected_tag"
          test -n "$archive"
          printf '%s\n' 'user-agent=build' > "$NPM_CONFIG_USERCONFIG"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            # First-publish bootstrap: npm refuses to create a new package via
            # OIDC alone. Write the token only into the isolated user config.
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$NPM_CONFIG_USERCONFIG"
            npm publish "$archive" --ignore-scripts --access public
            exit 0
          fi

          # An empty token in the environment forces a failed token handshake
          # and blocks OIDC trusted publishing.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true

          if grep -v '^user-agent=build$' "$NPM_CONFIG_USERCONFIG"; then
            echo "The publishing npm config must not contain a long-lived token." >&2
            exit 1
          fi

          # Trusted publishing exchanges the workflow OIDC identity. No token is
          # read or written by this repository when NPM_TOKEN is unset. The
          # package must already exist with a trusted publisher for this
          # workflow, or NPM_TOKEN must be provided for the first upload.
          npm publish "$archive" --ignore-scripts --access public
