name: Publish crate

on:
  workflow_dispatch:
    inputs:

      package:
        description: Workspace crate to publish (solana_kit or solana_kit_*)
        required: true
        type: string

      dry_run:
        description: Verify the packaged crate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: crates-io-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    env:
      PACKAGE: ${{ inputs.package }}
      CARGO_HTTP_USER_AGENT: solana-kit-publishing
      GIT_HTTP_USER_AGENT: solana-kit-publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate crate selection
        shell: bash

        run: |
          set -euo pipefail
          case "$PACKAGE" in
            solana_kit|solana_kit_*) ;;
            *) echo 'Select a Solana Kit workspace crate.' >&2; exit 1 ;;
          esac
          test -f "crates/$PACKAGE/Cargo.toml"

      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Verify packaged crate
        run: cargo +1.99.1 publish --locked --dry-run --package "$PACKAGE"

      - name: Authenticate with crates.io
        if: inputs.dry_run == false
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish verified crate
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +1.99.1 publish --locked --package "$PACKAGE"
