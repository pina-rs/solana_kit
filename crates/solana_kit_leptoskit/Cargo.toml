[package]
name = "solana_kit_leptoskit"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "README.md", "LICENSE"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_leptoskit"
rust-version.workspace = true
description = "Explicit LeptosKit guest HTTP and native host ownership for off-chain clients"

[features]
default = []
guest = ["leptoskit_bridge/guest"]
host = ["dep:leptoskit_native", "dep:leptoskit_wasm", "dep:solana_kit_native", "dep:tokio"]

[dependencies]
leptoskit_bridge = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "fecf8628d326ff7b03f295523e6bb584c3fdf88d" }
leptoskit_native = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "fecf8628d326ff7b03f295523e6bb584c3fdf88d", optional = true }
leptoskit_wasm = { version = "=0.1.0", git = "https://github.com/ifiokjr/leptoskit", rev = "fecf8628d326ff7b03f295523e6bb584c3fdf88d", optional = true }
solana_kit_client.workspace = true
solana_kit_native = { workspace = true, optional = true }
tokio = { version = "=1.54.1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros"] }
wat = "=1.262.0"
