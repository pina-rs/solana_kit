[package]
name = "solana_kit_dapp_publisher"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "MIT-DART.txt", "THIRD_PARTY_NOTICES.md"]
license = "Unlicense AND MIT"
publish = false
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_dapp_publisher"
rust-version.workspace = true
description = "Portable dApp publication attestation and prepared-transaction client policy"

[features]
default = []
crypto = [
  "solana_kit_core/crypto",
  "solana_kit_core/text-codecs",
  "dep:solana_kit_mpl_token_metadata",
  "solana_kit_mpl_token_metadata/pda",
]

[dependencies]
solana_kit_core = { workspace = true, default-features = false }
solana_kit_mpl_token_metadata = { workspace = true, optional = true }
