[package]
name = "solana_kit_dapp_publisher"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "MIT-DART.txt", "THIRD_PARTY_NOTICES.md"]
license = "Unlicense AND MIT"
publish = false
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_dapp_publisher"
rust-version.workspace = true
description = "Portable dApp publication policy, portal protocol and resumable metadata hydration"

[features]
default = []
cli = ["dep:http"]
portal = ["dep:solana_kit_client", "dep:serde", "dep:serde_json"]
workflow = ["portal", "crypto", "dep:http"]
crypto = [
  "solana_kit_core/crypto",
  "solana_kit_core/text-codecs",
  "dep:solana_kit_mpl_token_metadata",
  "solana_kit_mpl_token_metadata/pda",
]

[dependencies]
http = { version = "1.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"], optional = true }
solana_kit_client = { workspace = true, optional = true }
solana_kit_core = { workspace = true, default-features = false }
solana_kit_mpl_token_metadata = { workspace = true, optional = true }
