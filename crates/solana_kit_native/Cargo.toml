[package]
name = "solana_kit_native"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_native"
rust-version.workspace = true
description = "Bounded Tokio HTTP/TLS transport for off-chain Solana applications"

[dependencies]
bytes = "=1.11.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
solana_kit_client.workspace = true
tokio = { version = "=1.54.1", features = ["net", "time", "io-util", "macros"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.10"

[dev-dependencies]
solana_kit_core.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
