[package]
name = "solana_kit_signers"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "README.md", "LICENSE", "DART-LICENSE", "THIRD_PARTY_NOTICES.md"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_signers"
rust-version.workspace = true
description = "Portable asynchronous signer capabilities for off-chain Solana clients"

[features]
default = []
crypto = ["solana_kit_core/crypto"]

[dependencies]
solana_kit_core.workspace = true

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
