[package]
name = "solana_kit_wasi"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_wasi"
rust-version.workspace = true
description = "Caller-owned WASI Preview2 transports for off-chain Solana clients"

[features]
websocket = ["dep:rustls", "dep:tungstenite"]

[dependencies]
solana_kit_client.workspace = true

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wasip2 = "=1.0.4"
rustls = { version = "=0.23.46", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["handshake"] }
