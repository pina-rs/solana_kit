[package]
name = "solana_kit_client"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_client"
rust-version.workspace = true
description = "Executor-neutral typed Solana RPC for off-chain applications"

[features]
confirmation-factories = ["dep:solana_kit_system"]
reactive = ["dep:futures-core"]
resource-estimation = ["dep:solana_kit_compute_budget"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
futures-core = { version = "=0.3.34", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
solana_kit_compute_budget = { workspace = true, optional = true }
solana_kit_core.workspace = true
solana_kit_system = { workspace = true, optional = true }

[dev-dependencies]
futures = "=0.3.31"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
