[package]
name = "solana_kit_client"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_client"
rust-version.workspace = true
description = "Executor-neutral typed Solana RPC for off-chain applications"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
solana_kit_core.workspace = true

[dev-dependencies]
futures = "=0.3.31"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
