[package]
name = "solana_kit_surfpool"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "MIT-DART.txt", "THIRD_PARTY_NOTICES.md"]
license = "Unlicense AND MIT"
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_surfpool"
rust-version.workspace = true
description = "Portable typed Surfpool cheatcodes for off-chain Solana clients"

[features]
default = []
crypto = ["solana_kit_core/crypto", "dep:solana_kit_associated_token_account"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
solana_kit_associated_token_account = { workspace = true, features = ["crypto"], optional = true }
solana_kit_client.workspace = true
solana_kit_core.workspace = true
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
