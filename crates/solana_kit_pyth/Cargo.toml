[package]
name = "solana_kit_pyth"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "README.md", "LICENSE", "MIT-DART.txt", "THIRD_PARTY_NOTICES.md"]
license = "Unlicense AND MIT"
publish = false
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_pyth"
rust-version.workspace = true
description = "Portable Pyth price, account and Wormhole clients for off-chain applications"

[features]
default = []
crypto = ["solana_kit_core/crypto"]
hermes = ["dep:num-traits", "dep:serde", "dep:serde_json", "dep:solana_kit_client", "solana_kit_core/fixed-points"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "arbitrary_precision"], optional = true }
solana_kit_client = { workspace = true, optional = true }
solana_kit_core.workspace = true

[dev-dependencies]
hex-literal = "1.0.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
solana_kit_native.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
