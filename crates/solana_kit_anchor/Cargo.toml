[package]
name = "solana_kit_anchor"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_anchor"
rust-version.workspace = true
description = "Bounded portable Anchor IDL, Borsh, events, and errors for off-chain clients"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false }
solana_kit_core.workspace = true
