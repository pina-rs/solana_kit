[package]
name = "solana_kit_privacy_rings"
version.workspace = true
authors.workspace = true
edition.workspace = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
license = "Unlicense"
publish = false
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_privacy_rings"
rust-version.workspace = true
description = "Solana Privacy Rings client on Kit addresses, instructions, and RPC"

[features]
default = []
crypto = [
  "dep:aes",
  "dep:ctr",
  "dep:curve25519-dalek",
  "dep:hkdf",
  "dep:zeroize",
  "solana_kit_core/crypto",
]
poseidon = ["dep:ark-bn254", "dep:light-poseidon"]

[dependencies]
aes = { version = "=0.8.4", optional = true }
ark-bn254 = { version = "=0.6.0", default-features = false, features = ["std"], optional = true }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
ctr = { version = "=0.9.2", optional = true }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables"], optional = true }
hkdf = { version = "=0.12.4", default-features = false, optional = true }
light-poseidon = { version = "=0.5.0", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
sha2 = { version = "=0.10.9", default-features = false }
solana_kit_client.workspace = true
solana_kit_core.workspace = true
zeroize = { version = "=1.9.1", default-features = false, optional = true }

[dev-dependencies]
futures = "=0.3.31"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
