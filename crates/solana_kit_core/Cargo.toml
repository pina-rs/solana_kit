[package]
name = "solana_kit_core"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
include = ["src/**", "README.md", "LICENSE"]
license.workspace = true
readme = "README.md"
repository = "https://github.com/pina-rs/solana_kit/tree/main/crates/solana_kit_core"
rust-version.workspace = true
description = "Portable Solana values, instructions, and deterministic cryptography"

[features]
default = []
crypto = ["dep:sha2", "dep:curve25519-dalek", "dep:ed25519-dalek"]
fixed-points = ["dep:num-bigint", "dep:num-traits"]


[dependencies]
num-bigint = { version = "0.4.6", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false, optional = true }

bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1.3", default-features = false, optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
